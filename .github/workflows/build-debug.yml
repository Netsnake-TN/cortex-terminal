name: Build Debug APK

on:
  push:
    branches:
      - testing-debug-build
  pull_request:
    branches:
      - testing-debug-build
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          set -e
          SDK=$HOME/android-sdk
          mkdir -p $SDK/cmdline-tools
          wget -q -O /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools $SDK/cmdline-tools/latest
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
          echo "$SDK/cmdline-tools/latest/bin" >> $GITHUB_PATH
          export PATH=$SDK/cmdline-tools/latest/bin:$PATH
          # Accept licenses first (yes gets SIGPIPE when sdkmanager exits, hence || true)
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Cache cortex-hook Libraries
        uses: actions/cache@v4
        with:
          path: hook-libs
          key: cortex-hook-${{ hashFiles('app/src/main/cpp/cortex-hook.c', 'app/src/main/cpp/hook/**', 'app/src/main/cpp/gosys/**', 'scripts/build-gosys.sh', 'app/src/main/cpp/root/**', '.github/workflows/build-debug.yml') }}

      - name: Build Glibc cortex-hook Libraries
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf libc6-dev-arm64-cross libc6-dev-armhf-cross dpkg-dev
          mkdir -p hook-libs
          scripts/build-gosys.sh
          aarch64-linux-gnu-gcc -std=gnu11 -shared -fPIC -O3 -fno-delete-null-pointer-checks -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm64.so app/src/main/cpp/cortex-hook.c -ldl
          arm-linux-gnueabihf-gcc -std=gnu11 -shared -fPIC -O3 -fno-delete-null-pointer-checks -Wall -Wno-nonnull-compare -Wl,-z,max-page-size=16384 -o hook-libs/libcortex-hook-arm.so app/src/main/cpp/cortex-hook.c -ldl
          aarch64-linux-gnu-gcc -std=gnu11 -static -O2 -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 -o hook-libs/cortex-chroot-arm64.elf app/src/main/cpp/root/cortex-chroot.c
          arm-linux-gnueabihf-gcc -std=gnu11 -static -O2 -Wall -Wextra -Werror -Wl,-z,max-page-size=16384 -o hook-libs/cortex-chroot-arm.elf app/src/main/cpp/root/cortex-chroot.c

      - name: Copy native libs to assets
        run: |
          cp hook-libs/libcortex-hook-arm64.so app/src/main/assets/libcortex-hook-arm64.so
          cp hook-libs/libcortex-hook-arm.so app/src/main/assets/libcortex-hook-arm.so
          cp hook-libs/cortex-chroot-arm64.elf app/src/main/assets/cortex-chroot-arm64.elf
          cp hook-libs/cortex-chroot-arm.elf app/src/main/assets/cortex-chroot-arm.elf

      - name: Build cortex-redirect seccomp supervisor
        run: |
          sudo apt-get update -o Acquire::Retries=3 -qq
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu file
          bash cortex-redirect/build.sh

      - name: Assemble Debug APK
        run: |
          ./gradlew assembleDebug --build-cache --parallel --stacktrace

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: cortex-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 3
